name: GPU (RTX 3050)

on:
  workflow_run:
    workflows: ["Imagem (GHCR)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Modo
        type: choice
        options: [benchmark, train]
        default: benchmark
      arch:
        description: Arquitetura (treino)
        type: choice
        options: [resnet20, resnet56, resnet110]
        default: resnet20
      epochs:
        description: Épocas (treino)
        default: "30"
      batch_size:
        description: Tamanho do lote (treino)
        default: "128"
      lr:
        description: Taxa de aprendizado inicial (treino)
        default: "0.1"
      amp:
        description: Precisão mista (AMP)
        type: boolean
        default: true
      seed:
        description: Semente (vazio = aleatória)
        default: ""
      image_tag:
        description: Tag da imagem no GHCR (sha de um commit ou latest)
        default: latest

permissions:
  contents: read
  packages: read

# Sem bloco `concurrency`: o GitHub guarda só 1 run pendente por grupo e cancelaria
# um treino na fila quando chegasse outro job. Quem serializa é o próprio runner set
# (maxRunners: 1 + nvidia.com/gpu: 1): os jobs esperam na fila do ARC, nenhum some.

jobs:
  run:
    # Segurança: este job roda na SUA máquina, com acesso ao Docker do host (= root).
    # Nunca tem gatilho de push/PR. O workflow_run casa workflows pelo NOME, então um PR
    # de fork com um workflow homônimo também dispararia: por isso a guarda confere o
    # repositório de origem, o arquivo do workflow e o evento, e não só a branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/image.yaml' &&
       contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: arc-runner-set-gpu
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/lorkyrr/pytorch-arc-hosted:${{ github.event.workflow_run.head_sha || inputs.image_tag }}
      CONTAINER: pah-${{ github.run_id }}-${{ github.run_attempt }}
      MODE: ${{ inputs.mode || 'benchmark' }}
    steps:
      - name: Descobrir a GPU que o Kubernetes reservou pra este pod
        run: |
          uuid="${NVIDIA_VISIBLE_DEVICES:-}"
          # O NVIDIA Container Toolkit >= 1.20 injeta a GPU no pod via CDI e troca a variável
          # por "void" (visto em 2026-09-29). Aí o UUID vem do nvidia-smi, que dentro do pod
          # só enxerga a(s) GPU(s) que o device plugin alocou pra ele.
          if [[ ! "$uuid" =~ ^GPU-[0-9a-f-]+$ ]]; then
            uuid=$(nvidia-smi --query-gpu=uuid --format=csv,noheader 2>/dev/null | tr -d ' ' || true)
          fi
          echo "NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-<vazio>} -> GPU alocada: ${uuid:-<nenhuma>}"
          # Exatamente um UUID. Vazio, "all" ou várias GPUs = sem reserva real: nunca cair pra --gpus all.
          if [[ ! "$uuid" =~ ^GPU-[0-9a-f-]+$ ]]; then
            echo "::error::o pod não recebeu exatamente uma GPU do device plugin. Rode 'scripts/cluster.sh status'."
            exit 1
          fi
          echo "GPU_UUID=$uuid" >> "$GITHUB_ENV"

      # `docker login` puro em vez de uma action de terceiros: aqui tudo roda com root no host
      - name: Login no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Baixar a imagem (só as camadas que o host ainda não tem)
        run: docker pull "$IMAGE"

      - name: Rodar
        env:
          ARCH: ${{ inputs.arch }}
          EPOCHS: ${{ inputs.epochs }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          LR: ${{ inputs.lr }}
          AMP: ${{ inputs.amp }}
          SEED: ${{ inputs.seed }}
        run: |
          args=("$MODE" --require-gpu)
          if [ "$MODE" = train ]; then
            args+=(--arch "$ARCH" --epochs "$EPOCHS" --batch-size "$BATCH_SIZE" --lr "$LR")
            if [ "$AMP" = false ]; then args+=(--no-amp); fi
            if [ -n "$SEED" ]; then args+=(--seed "$SEED"); fi
          fi
          # Container órfão de um job cujo pod morreu (cluster.sh down, reboot) ainda seguraria
          # a GPU. Com maxRunners: 1, nenhum outro job nosso pode estar rodando agora.
          # Filtro por LABEL, nunca por nome: `name=^pah-` casava com `pah-control-plane`, o node
          # do kind, e o job apagava o próprio cluster (2026-09-29).
          docker ps -aq --filter "label=pah-arc-hosted.job" | xargs -r docker rm -f
          # O docker daqui fala com o daemon do HOST (socket montado): o container
          # é "irmão" do pod, preso à mesma GPU que o k8s reservou para este pod.
          docker run --name "$CONTAINER" --label pah-arc-hosted.job --gpus "device=$GPU_UUID" --shm-size=1g \
            -v pah-cifar10:/data "$IMAGE" "${args[@]}"

      - name: Coletar resultados e limpar
        if: always()
        run: |
          mkdir -p out
          docker cp "$CONTAINER:/out/." out/ 2>/dev/null || true
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true

      # Fixado por SHA (o Dependabot atualiza o SHA e o comentário). always(): se o treino
      # estourar o timeout ou for cancelado, o melhor checkpoint até ali ainda sobe.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.MODE == 'train'
        with:
          name: ${{ inputs.arch }}-cifar10-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
